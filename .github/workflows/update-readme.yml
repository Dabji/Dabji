name: 🔄 Actualizar README (actividad + proyectos)

on:
  schedule:
    # Cada 3 días a las 06:00 UTC (01:00 Colombia)
    - cron: "0 6 */3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generar actividad reciente y proyectos por estrellas (ES + EN)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.parse, urllib.error, urllib.request
          from datetime import datetime, timezone

          USER = "Dabji"
          TOKEN = os.environ["GITHUB_TOKEN"]

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"GitHub API respondió {e.code} para {path}") from e
              except urllib.error.URLError as e:
                  raise RuntimeError(f"No se pudo conectar a GitHub API: {e.reason}") from e
              if isinstance(data, dict) and data.get("message"):
                  raise RuntimeError(f"GitHub API error para {path}: {data['message']}")
              return data

          def hace(iso, lang):
              try:
                  dt = datetime.fromisoformat(str(iso).replace("Z", "+00:00"))
              except (TypeError, ValueError):
                  return "fecha desconocida" if lang == "es" else "unknown date"
              d = datetime.now(timezone.utc) - dt
              if lang == "es":
                  if d.days >= 30: return f"hace {d.days // 30} mes(es)"
                  if d.days >= 1:  return f"hace {d.days} día(s)"
                  h = d.seconds // 3600
                  return f"hace {h} hora(s)" if h else "hace minutos"
              if d.days >= 30: return f"{d.days // 30} month(s) ago"
              if d.days >= 1:  return f"{d.days} day(s) ago"
              h = d.seconds // 3600
              return f"{h} hour(s) ago" if h else "minutes ago"

          def html_url(obj, fallback):
              if isinstance(obj, dict):
                  return obj.get("html_url") or fallback
              return fallback

          T = {
              "es": {"push": "Hizo push de **{n} commit{s}** en", "merge": "Mergeó el PR",
                     "openpr": "Abrió el PR", "openissue": "Abrió el issue", "closeissue": "Cerró el issue",
                     "repo": "Creó el repositorio", "release": "Publicó la release", "star": "Le dio una estrella a",
                     "fork": "Hizo fork de", "public": "Hizo público", "en": " en",
                     "header": "| | 🔥 Últimos movimientos | |", "empty": "_Sin actividad pública reciente_",
                     "sub": "Actualizado automáticamente cada 3 días"},
              "en": {"push": "Pushed **{n} commit{s}** to", "merge": "Merged PR",
                     "openpr": "Opened PR", "openissue": "Opened issue", "closeissue": "Closed issue",
                     "repo": "Created repository", "release": "Published release", "star": "Starred",
                     "fork": "Forked", "public": "Made public", "en": " in",
                     "header": "| | 🔥 Latest moves | |", "empty": "_No recent public activity_",
                     "sub": "Automatically updated every 3 days"},
          }

          eventos = api(f"/users/{USER}/events/public?per_page=60")
          if not isinstance(eventos, list):
              eventos = []

          def actividad(lang):
              t = T[lang]
              filas, vistos = [], set()
              for e in eventos:
                  if not isinstance(e, dict):
                      continue
                  repo_data = e.get("repo") or {}
                  repo = repo_data.get("name") if isinstance(repo_data, dict) else None
                  created_at = e.get("created_at")
                  if not repo or not created_at:
                      continue
                  url = f"https://github.com/{repo}"
                  ty, p = e.get("type"), e.get("payload") or {}
                  if not isinstance(p, dict):
                      continue
                  if ty == "PushEvent":
                      commits = p.get("commits") or []
                      n = len(commits) if isinstance(commits, list) else 0
                      if not n: continue
                      linea = ("⚡", t["push"].format(n=n, s="s" if n > 1 else "") + f" [`{repo}`]({url})")
                  elif ty == "PullRequestEvent":
                      pr = p.get("pull_request") or {}
                      if not isinstance(pr, dict):
                          continue
                      number = pr.get("number")
                      if not number:
                          continue
                      pr_url = html_url(pr, f"{url}/pull/{number}")
                      if p.get("action") == "closed" and pr.get("merged"):
                          linea = ("🎉", f"{t['merge']} [#{number}]({pr_url}){t['en']} [`{repo}`]({url})")
                      elif p.get("action") == "opened":
                          linea = ("🔀", f"{t['openpr']} [#{number}]({pr_url}){t['en']} [`{repo}`]({url})")
                      else: continue
                  elif ty == "IssuesEvent" and p.get("action") in ("opened", "closed"):
                      issue = p.get("issue") or {}
                      if not isinstance(issue, dict):
                          continue
                      number = issue.get("number")
                      if not number:
                          continue
                      k = "openissue" if p["action"] == "opened" else "closeissue"
                      emoji = "🐛" if p["action"] == "opened" else "✅"
                      issue_url = html_url(issue, f"{url}/issues/{number}")
                      linea = (emoji, f"{t[k]} [#{number}]({issue_url}){t['en']} [`{repo}`]({url})")
                  elif ty == "CreateEvent" and p.get("ref_type") == "repository":
                      linea = ("🚀", f"{t['repo']} [`{repo}`]({url})")
                  elif ty == "ReleaseEvent" and p.get("action") == "published":
                      release = p.get("release") or {}
                      if not isinstance(release, dict):
                          continue
                      tag = release.get("tag_name")
                      if not tag:
                          continue
                      release_url = html_url(release, f"{url}/releases/tag/{urllib.parse.quote(str(tag), safe='')}")
                      linea = ("📦", f"{t['release']} [{tag}]({release_url}){t['en']} [`{repo}`]({url})")
                  elif ty == "WatchEvent":
                      linea = ("⭐", f"{t['star']} [`{repo}`]({url})")
                  elif ty == "ForkEvent":
                      linea = ("🍴", f"{t['fork']} [`{repo}`]({url})")
                  elif ty == "PublicEvent":
                      linea = ("🌍", f"{t['public']} [`{repo}`]({url})")
                  else:
                      continue
                  if linea[1] in vistos: continue
                  vistos.add(linea[1])
                  filas.append(f"| {linea[0]} | {linea[1]} | 🕓 *{hace(created_at, lang)}* |")
                  if len(filas) >= 8: break
              if not filas:
                  return T[lang]["empty"]
              return "\n".join(['<div align="center">', "", t["header"],
                                "|:---:|:----------------------|:---:|", *filas, "", "</div>"])

          repos = api(f"/users/{USER}/repos?per_page=100&type=owner")
          repos = [r for r in repos if isinstance(r, dict) and not r.get("fork")
                   and r.get("name", "").lower() != USER.lower()] if isinstance(repos, list) else []
          repos.sort(key=lambda r: r.get("pushed_at") or "", reverse=True)   # desempate: más activo primero
          repos.sort(key=lambda r: r.get("stargazers_count") or 0, reverse=True)
          top = repos[:6]

          def proyectos(lang):
              celdas = []
              for r in top:
                  name = r.get("name")
                  if not name:
                      continue
                  repo_url = html_url(r, f"https://github.com/{USER}/{name}")
                  pin = (f"https://github-readme-stats.vercel.app/api/pin/?username={USER}"
                         f"&repo={urllib.parse.quote(str(name), safe='')}&theme=tokyonight&hide_border=true&bg_color=0d1117")
                  celdas.append(f'<td align="center" width="50%">\n'
                                f'<a href="{repo_url}">\n<img src="{pin}" />\n</a>\n</td>')
              tr = []
              for i in range(0, len(celdas), 2):
                  fila = celdas[i] if i + 1 >= len(celdas) else celdas[i] + "\n" + celdas[i + 1]
                  tr.append(f"<tr>\n{fila}\n</tr>")
              return "\n".join(['<div align="center">', "",
                                f"<sub>🔄 {T[lang]['sub']}</sub>", "",
                                "<table>", *tr, "</table>", "", "</div>"])

          def inyectar(archivo, lang):
              if not os.path.exists(archivo): return
              with open(archivo, encoding="utf-8") as f:
                  md = f.read()
              md = re.sub(r"(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)",
                          rf"\1\n{actividad(lang)}\n\2", md, flags=re.S)
              md = re.sub(r"(<!--START_SECTION:projects-->).*?(<!--END_SECTION:projects-->)",
                          rf"\1\n{proyectos(lang)}\n\2", md, flags=re.S)
              with open(archivo, "w", encoding="utf-8") as f:
                  f.write(md)
              print(f"{archivo} actualizado ({lang})")

          inyectar("README.md", "es")
          inyectar("README.en.md", "en")
          EOF

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          git diff --staged --quiet || (git commit -m "🔄 Auto-update: actividad reciente y proyectos destacados" && git push)
